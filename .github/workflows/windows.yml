name: Build Windows

on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Windows project
        run: flutter create --platforms=windows --project-name lumora --org com.lumora .

      - name: Get packages
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - uses: actions/upload-artifact@v4
        with:
          name: Lumora-windows
          path: build/windows/x64/runner/Release
          if-no-files-found: error
